<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lumina · gallery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f7f8fc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      color: #1e1e2f;
    }
    .gallery-wrapper {
      max-width: 1280px;
      width: 100%;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
      color: #111;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 span {
      background: linear-gradient(145deg, #3b3b5c, #1e1e2f);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      color: white;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .subhead {
      color: #5b5b6e;
      margin-bottom: 2rem;
      font-size: 1.05rem;
      font-weight: 400;
      border-left: 4px solid #c0c0d0;
      padding-left: 1rem;
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1rem;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid #e0e2ec;
      padding-bottom: 1.2rem;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid #d0d2e0;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.55rem 1.4rem;
      border-radius: 40px;
      color: #2c2c40;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.01em;
      backdrop-filter: blur(4px);
    }

    .filter-btn:hover {
      background: #ffffff;
      border-color: #a0a2b8;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.03);
      transform: translateY(-1px);
    }

    .filter-btn.active {
      background: #1e1e2f;
      border-color: #1e1e2f;
      color: white;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.8rem;
      margin-bottom: 3rem;
    }

    .gallery-item {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.02);
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1), box-shadow 0.4s ease;
      cursor: pointer;
      aspect-ratio: 4 / 3;
    }

    .gallery-item:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 26px 38px -12px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.6);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), filter 0.4s ease;
      will-change: transform;
    }

    .gallery-item:hover img {
      transform: scale(1.06);
    }

    /* hover overlay text */
    .item-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.65) 0%, rgba(0, 0, 0, 0) 55%);
      opacity: 0;
      transition: opacity 0.35s ease;
      display: flex;
      align-items: flex-end;
      padding: 1.2rem;
      color: white;
      font-weight: 500;
      font-size: 0.95rem;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      letter-spacing: 0.2px;
    }

    .gallery-item:hover .item-overlay {
      opacity: 1;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 18, 0.92);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.8);
      background: #12121c;
      transition: transform 0.3s ease;
    }

    .lightbox-img {
      width: 100%;
      height: 100%;
      max-height: 85vh;
      object-fit: contain;
      display: block;
      border-radius: 28px;
      transition: opacity 0.3s ease;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 56px;
      height: 56px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
      font-weight: 300;
      line-height: 1;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-50%) scale(1.08);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .lightbox-nav.prev {
      left: 24px;
    }

    .lightbox-nav.next {
      right: 24px;
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 28px;
      width: 48px;
      height: 48px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      z-index: 1010;
      line-height: 1;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: rotate(90deg) scale(1.05);
    }

    .lightbox-counter {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      padding: 0.6rem 1.6rem;
      border-radius: 60px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    }
    @media (max-width: 680px) {
      body {
        padding: 1.5rem 1rem;
      }

      h1 {
        font-size: 1.8rem;
      }

      .filter-bar {
        gap: 0.4rem;
      }

      .filter-btn {
        padding: 0.45rem 1rem;
        font-size: 0.8rem;
      }

      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1rem;
      }

      .lightbox-nav {
        width: 44px;
        height: 44px;
        font-size: 1.6rem;
      }

      .lightbox-nav.prev {
        left: 12px;
      }

      .lightbox-nav.next {
        right: 12px;
      }

      .lightbox-close {
        top: 16px;
        right: 16px;
        width: 40px;
        height: 40px;
        font-size: 1.5rem;
      }

      .lightbox-counter {
        bottom: 16px;
        padding: 0.4rem 1.2rem;
        font-size: 0.8rem;
      }
    }

    @media (max-width: 420px) {
      .gallery-grid {
        grid-template-columns: 1fr 1fr;
        gap: 0.8rem;
      }

      .item-overlay {
        font-size: 0.75rem;
        padding: 0.8rem;
      }
    }

    .gallery-item.hidden {
      display: none;
    }

    .gallery-item img {
      opacity: 0;
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    .lightbox-content img {
      max-width: 100%;
      max-height: 85vh;
    }
  </style>
</head>
<body>
  <div class="gallery-wrapper">
    <h1>
      Iman's
      <span>gallery</span>
    </h1>
    <div class="subhead">filter by mood, explore the lightbox</div>

    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="nature">Nature</button>
      <button class="filter-btn" data-category="urban">Urban</button>
      <button class="filter-btn" data-category="abstract">Abstract</button>
      <button class="filter-btn" data-category="people">People</button>
    </div>


    <div class="gallery-grid" id="galleryGrid">
    
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-content" id="lightboxContent">
      <img class="lightbox-img" id="lightboxImg" src="" alt="lightbox image">
  
      <div class="lightbox-nav prev" id="lightboxPrev">‹</div>
      <div class="lightbox-nav next" id="lightboxNext">›</div>
      <div class="lightbox-close" id="lightboxClose">✕</div>
      <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
    </div>
  </div>

  <script>
    (function() {
   
      const images = [
        { id: 1, category: 'nature', title: 'Misty Forest', url: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&auto=format&fit=crop&q=80' },
        { id: 2, category: 'urban', title: 'City Lights', url: 'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=800&auto=format&fit=crop&q=80' },
        { id: 3, category: 'abstract', title: 'Fluid Colors', url: 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=800&auto=format&fit=crop&q=80' },
        { id: 4, category: 'people', title: 'Portrait', url: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800&auto=format&fit=crop&q=80' },
        { id: 5, category: 'nature', title: 'Mountain Lake', url: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800&auto=format&fit=crop&q=80' },
        { id: 6, category: 'urban', title: 'Skyscraper', url: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=800&auto=format&fit=crop&q=80' },
        { id: 7, category: 'abstract', title: 'Geometric', url: 'https://images.unsplash.com/photo-1550859492-d5da9d8e45f3?w=800&auto=format&fit=crop&q=80' },
        { id: 8, category: 'people', title: 'Street Style', url: 'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=800&auto=format&fit=crop&q=80' },
        { id: 9, category: 'nature', title: 'Desert Dunes', url: 'https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?w=800&auto=format&fit=crop&q=80' },
        { id: 10, category: 'urban', title: 'Night Bridge', url: 'https://images.unsplash.com/photo-1514924013411-cbf25faa35bb?w=800&auto=format&fit=crop&q=80' },
        { id: 11, category: 'abstract', title: 'Waves', url: 'https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?w=800&auto=format&fit=crop&q=80' },
        { id: 12, category: 'people', title: 'Joyful', url: 'https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=800&auto=format&fit=crop&q=80' }
      ];

      const galleryGrid = document.getElementById('galleryGrid');
      const filterBar = document.getElementById('filterBar');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const lightboxPrev = document.getElementById('lightboxPrev');
      const lightboxNext = document.getElementById('lightboxNext');
      const lightboxClose = document.getElementById('lightboxClose');
      const lightboxCounter = document.getElementById('lightboxCounter');

     
      let currentImages = [...images];       // images after filter (visible)
      let currentIndex = 0;                  // index in currentImages
      let activeFilter = 'all';

      function renderGallery(filter = 'all') {
        activeFilter = filter;
  
        currentImages = filter === 'all' ? [...images] : images.filter(img => img.category === filter);
        
        galleryGrid.innerHTML = currentImages.map((img, idx) => `
          <div class="gallery-item" data-index="${idx}" data-category="${img.category}">
            <img src="${img.url}" alt="${img.title}" loading="lazy">
            <div class="item-overlay">${img.title}</div>
          </div>
        `).join('');
      }

     
      renderGallery('all');

      filterBar.addEventListener('click', (e) => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const category = btn.dataset.category;
        renderGallery(category);

        if (lightbox.classList.contains('open')) {
          closeLightbox();
        }
      });


      galleryGrid.addEventListener('click', (e) => {
        const item = e.target.closest('.gallery-item');
        if (!item) return;

        const index = parseInt(item.dataset.index, 10);
        
        if (isNaN(index) || index < 0 || index >= currentImages.length) return;

        currentIndex = index;
        updateLightboxImage();
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden'; // prevent scrolling
      });

      function updateLightboxImage() {
        if (!currentImages.length) return;
        const img = currentImages[currentIndex];
        lightboxImg.src = img.url;
        lightboxImg.alt = img.title;
        lightboxCounter.textContent = `${currentIndex + 1} / ${currentImages.length}`;
      }

     
      function closeLightbox() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
      }

      lightboxClose.addEventListener('click', closeLightbox);

    
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) {
          closeLightbox();
        }
      });

      
      function navigate(direction) {
        if (!currentImages.length) return;

        if (direction === 'next') {
          currentIndex = (currentIndex + 1) % currentImages.length;
        } else {
          currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
        }
        updateLightboxImage();
      }

      lightboxPrev.addEventListener('click', (e) => {
        e.stopPropagation();
        navigate('prev');
      });

      lightboxNext.addEventListener('click', (e) => {
        e.stopPropagation();
        navigate('next');
      });

     
      window.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('open')) return;

        if (e.key === 'Escape') {
          closeLightbox();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          navigate('prev');
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          navigate('next');
        }
      });
    })();
  </script>
</body>
</html>
